<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variable Group Manager — Login</title>
<style>
body{font:16px system-ui;background:#f3f5f8;margin:0;min-height:100vh;display:grid;place-items:center;color:#182230}
main{background:white;padding:28px;border-radius:14px;box-shadow:0 8px 28px #15243a18;width:min(390px,calc(100% - 48px))}
label{display:block;margin:14px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c8d0db;border-radius:8px}
button{margin-top:18px;width:100%;padding:12px;background:#1769d2;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer}.error{color:#b42318}
</style>
</head><body><main>
<h2>Azure Variable Group Manager</h2><p>Sign in to the internal tool.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Username</label><input name="username" autocomplete="username" required>
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
</main></body></html>
